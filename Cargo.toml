[workspace]
members = [
    "crates/pmkt-domain",
    "crates/pmkt-strategy",
    "crates/pmkt-data",
    "crates/pmkt-execution",
    "crates/pmkt-store",
    "crates/pmkt-app",
    "crates/pmkt-tui",
    "crates/pmkt-cli",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CSV
csv = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Config
config = "0.14"

# Channels / concurrency
parking_lot = "0.12"
